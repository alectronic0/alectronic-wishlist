<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brands, Stores & Subscriptions 🛒 | Gift Alec Today</title>
  <meta name="description" content="Alec Doran-Twyford's favorite brands, nerd merch stores, household decor, and subscription boxes.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="banner">Last updated on: 1st August 2026</div>

<header class="site-nav"></header>

<main class="container">
  <section class="hero" style="padding: 16px 0; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 2.2rem;">🛒</span>
      <div>
        <h1 id="misc-title">Brands, Stores & Subscriptions 🛍️</h1>
        <p id="misc-subtitle">Favorite tech merch stores, household decor, and ongoing subscription boxes.</p>
      </div>
    </div>
  </section>

  <!-- NERD & TECH MERCH -->
  <section class="wishlist-section">
    <div class="section-header">
      <h2>🤓 Tech & Nerd Merch Stores</h2>
    </div>

    <div class="horizontal-card-grid" id="tech-merch-grid">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- HOUSEHOLD BRANDS & DECOR -->
  <section class="wishlist-section">
    <div class="section-header">
      <h2>🏠 Household Brands & Wall Decor</h2>
    </div>

    <div class="horizontal-card-grid" id="household-grid">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- SUBSCRIPTION BOXES -->
  <section class="wishlist-section">
    <div class="section-header">
      <h2>📦 Subscription Boxes</h2>
    </div>

    <div class="list-group" id="subscriptions-list-group">
      <!-- Populated by JS -->
    </div>
  </section>
</main>

<footer id="footer" style="text-align: center; padding: 24px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px;">
  <p>&copy; <span class="year"></span> Alec &middot; gift.alec.today</p>
  <script>document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());</script>
</footer>

<script src="content.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  const data = window.SITE_CONTENT && window.SITE_CONTENT.misc;
  if (!data) return;

  if (data.title) document.getElementById('misc-title').textContent = data.title;
  if (data.subtitle) document.getElementById('misc-subtitle').textContent = data.subtitle;

  // Render Tech Merch
  const techGrid = document.getElementById('tech-merch-grid');
  if (techGrid && data.techMerch) {
    techGrid.innerHTML = data.techMerch.map(item => `
      <a href="${item.url}" target="_blank" class="horizontal-card">
        <img src="${item.icon}" alt="${item.name} Logo">
        <span>${item.name}</span>
      </a>
    `).join('');
  }

  // Render Household
  const householdGrid = document.getElementById('household-grid');
  if (householdGrid && data.householdBrands) {
    householdGrid.innerHTML = data.householdBrands.map(item => `
      <a href="${item.url}" target="_blank" class="horizontal-card">
        <img src="${item.icon}" alt="${item.name} Logo">
        <span>${item.name}</span>
      </a>
    `).join('');
  }

  // Render Subscriptions grouped by category
  const subsContainer = document.getElementById('subscriptions-list-group');
  if (subsContainer && data.subscriptions) {
    const categories = {};
    data.subscriptions.forEach(item => {
      const cat = item.category || 'Other';
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(item);
    });

    subsContainer.innerHTML = Object.entries(categories).map(([categoryName, items]) => `
      <h3>${categoryName}</h3>
      <div class="clean-list">
        ${items.map(item => `<li><a href="${item.url}" target="_blank">${item.name}</a></li>`).join('')}
      </div>
    `).join('');
  }
})();
</script>
</body>
</html>
