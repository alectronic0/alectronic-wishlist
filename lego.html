<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO® Collection & Wishlist 🧱 | Gift Alec Today</title>
  <meta name="description" content="Alec's LEGO Collection — official wishlist sets and registered owned sets, organized by Star Wars, Botanical, Zelda & Gaming, and Icons.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="./style/styles.css">
</head>
<body>

<div class="banner">Last updated on: 29th July 2026</div>

<header class="site-nav"></header>

<main class="container">
  <!-- Hero Header -->
  <section class="hero" style="padding: 16px 0; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="https://unavatar.io/lego.com" alt="LEGO Logo" style="width: 42px; height: 42px; border-radius: 8px;">
        <div>
          <h1 id="lego-title">LEGO® Collection & Wishlist 🧱</h1>
          <p id="lego-subtitle"></p>
        </div>
      </div>
      <a id="lego-wishlist-link" href="#" target="_blank" class="inv-action-btn" style="padding: 8px 18px; font-size: 0.88rem;">Official LEGO Wishlist Page ↗</a>
    </div>
  </section>

  <!-- THEMATIC LEGO SECTIONS -->
  <div id="lego-themes-container" style="display: flex; flex-direction: column; gap: 32px; margin-top: 24px;"></div>
</main>

<footer id="footer" style="text-align: center; padding: 24px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px;">
  <p>&copy; <span class="year"></span> Alec &middot; gift.alec.today</p>
  <script>document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());</script>
</footer>

<script src="./js/content.js"></script>
<script src="./js/nav.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
