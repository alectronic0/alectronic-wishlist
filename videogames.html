<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Games Library 🎮 | Gift Alec Today</title>
  <meta name="description" content="Alec Doran-Twyford's Video Game Library — Nintendo Switch, 3DS, retro Game Boy, and Steam PC games collection.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="banner">Last updated on: 29th July 2026</div>

<header class="site-nav"></header>

<main class="container">
  <section class="hero" style="padding: 16px 0; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="https://unavatar.io/nintendo.com" alt="Nintendo Logo" style="width: 42px; height: 42px; border-radius: 8px;">
        <div>
          <h1>Video Games Library 🎮</h1>
          <p id="vg-subtitle">Nintendo Switch, 3DS, Game Boy retro games, and Steam PC library.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- GAME CONSOLE CATEGORIES -->
  <section class="wishlist-section" id="vg-owned-section"></section>
</main>

<footer id="footer" style="text-align: center; padding: 24px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px;">
  <p>&copy; <span class="year"></span> Alec &middot; gift.alec.today</p>
  <script>document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());</script>
</footer>

<script src="content.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  const data = window.SITE_CONTENT.videogames;
  if (!data) return;

  const consoles = data.consoles;
  document.getElementById('vg-subtitle').textContent = `${data.owned.length} Registered Games & Titles`;

  function groupByConsole(items) {
    const groups = {};
    for (const item of items) {
      const key = item.console || 'other';
      if (!groups[key]) groups[key] = [];
      groups[key].push(item);
    }
    return groups;
  }

  function getConsoleEmoji(consoleKey) {
    const map = {
      switch: '🔴',
      steam: '💨',
      gamecube: '🟣',
      n64: '🕹️',
      ds_3ds: '🔵',
      retro_gb: '🟢',
      wii_wiiu: '🌊',
      amiibo: '🗿',
      zelda: '⚔️',
      mario: '🍄',
      pokemon: '🔴',
      nintendo_flagship: '🌟',
      rpg: '🗡️',
      indie_masterpieces: '💎',
      collection: '🎮'
    };
    return map[consoleKey] || '🎮';
  }

  function renderCard(item) {
    const card = document.createElement('div');
    card.className = 'wishlist-item';

    const isValidImg = item.img && !item.img.includes('unavatar.io') && item.img.startsWith('http');

    const imgHtml = isValidImg
      ? `<div class="wishlist-item-img"><img src="${item.img}" alt="${item.name}" loading="lazy"></div>`
      : `<div class="wishlist-item-img placeholder-card" style="background: linear-gradient(135deg, rgba(40, 20, 36, 0.9), rgba(15, 8, 14, 0.95)); border: 1px solid var(--border-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 14px; text-align: center; gap: 8px;">
           <span style="font-size: 2.2rem; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));">${getConsoleEmoji(item.console)}</span>
           <span style="font-size: 0.85rem; font-weight: 800; color: var(--gold); line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">${item.name}</span>
           <span style="font-size: 0.7rem; color: var(--accent); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;">${item.badge}</span>
         </div>`;

    card.innerHTML = `
      ${imgHtml}
      <div class="wishlist-item-info">
        <div class="wishlist-item-title">${item.name}</div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px;">
          <span class="inv-item-badge">${item.badge}</span>
          <span style="font-size:0.76rem; color:var(--mint); font-weight:600;">✓ In Collection</span>
        </div>
      </div>`;
    return card;
  }

  function renderConsolesSection(containerId, items) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const groups = groupByConsole(items);

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<h2>🎮 Video Game Collection (${items.length} Games)</h2><p>Grouped by Nintendo platform and Steam PC library.</p>`;
    container.appendChild(header);

    const consoleOrder = Object.keys(consoles);
    for (const key of Object.keys(groups)) {
      if (!consoleOrder.includes(key)) consoleOrder.push(key);
    }

    for (const consoleKey of consoleOrder) {
      const consoleItems = groups[consoleKey];
      if (!consoleItems || consoleItems.length === 0) continue;

      const cfg = consoles[consoleKey] || { label: consoleKey, color: 'var(--accent)' };

      const h3 = document.createElement('h3');
      h3.textContent = `${cfg.label} (${consoleItems.length})`;
      h3.style.cssText = `color:${cfg.color}; margin:24px 0 12px; font-size:1.1rem; border-bottom:1px solid ${cfg.color}33; padding-bottom:8px;`;
      container.appendChild(h3);

      const grid = document.createElement('div');
      grid.className = 'item-list';
      for (const item of consoleItems) {
        grid.appendChild(renderCard(item));
      }
      container.appendChild(grid);
    }
  }

  renderConsolesSection('vg-owned-section', data.owned);
})();
</script>
</body>
</html>
