<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books & Library 📚 | Gift Alec Today</title>
  <meta name="description" content="Alec Doran-Twyford's Book Library — Cookbooks, manga, computer science textbooks, and pop non-fiction.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="banner">Last updated on: 29th July 2026</div>

<header class="site-nav"></header>

<main class="container">
  <section class="hero" style="padding: 16px 0; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 2.2rem;">📚</span>
        <div>
          <h1>Books & Reference 📖</h1>
          <p id="books-subtitle">Culinary reference books, hardcover manga collections, and CS textbooks.</p>
        </div>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <a id="amazon-wishlist-link" href="#" target="_blank" class="inv-action-btn" style="padding: 8px 14px; font-size: 0.85rem; display: none;">Amazon Wishlist ↗</a>
      </div>
    </div>
  </section>

  <!-- MANGA & VOLUME SERIES -->
  <section class="wishlist-section">
    <div class="section-header">
      <h2>📚 Manga & Graphic Novels</h2>
      <p>Volume collections and series progress.</p>
    </div>
    <div id="manga-section" style="display: flex; flex-direction: column; gap: 16px;"></div>
  </section>

  <!-- NORMAL CATEGORIZED BOOKS -->
  <div id="books-section"></div>
</main>

<!-- MODAL OVERLAY -->
<div id="book-modal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close" id="modal-close-btn" type="button" aria-label="Close Modal">&times;</button>
    <div class="modal-body" id="modal-body-content"></div>
  </div>
</div>

<footer id="footer" style="text-align: center; padding: 24px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px;">
  <p>&copy; <span class="year"></span> Alec &middot; gift.alec.today</p>
  <script>document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());</script>
</footer>

<script src="./js/content.js"></script>
<script src="./js/nav.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
