<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books & Library 📚 | Gift Alec Today</title>
  <meta name="description" content="Alec Doran-Twyford's Book Library — Cookbooks, manga, computer science textbooks, and pop non-fiction.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/cookie.js"></script>
</head>
<body>
<main class="container">
  <div id="catalogue" data-page="books"></div>

  <section class="catalogue__section">
    <h2>Manga series</h2>
    <p class="lede">Pick a volume number to see where to get it. Green volumes are already on the shelf; pink ones are wanted.</p>
    <div id="manga-section" class="manga-list"></div>
  </section>
</main>

<!-- MODAL OVERLAY -->
<div id="book-modal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close" id="modal-close-btn" type="button" aria-label="Close Modal">&times;</button>
    <div class="modal-body" id="modal-body-content"></div>
  </div>
</div>

<script src="./js/content.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
