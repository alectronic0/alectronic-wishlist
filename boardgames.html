<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Games Collection 🎲 | Gift Alec Today</title>
  <meta name="description" content="Alec Doran-Twyford's Board Games Collection — Owned tabletop games, expansions, and wanted games on BGG.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="banner">Last updated on: 29th July 2026</div>

<header class="site-nav"></header>

<main class="container">
  <section class="hero" style="padding: 16px 0; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="https://unavatar.io/boardgamegeek.com" alt="BGG Logo" style="width: 42px; height: 42px; border-radius: 8px;">
        <div>
          <h1>Board Games & Tabletop 🎲</h1>
          <p id="boardgame-subtitle">Tabletop strategy, push-your-luck bag builders, card games, and expansions.</p>
        </div>
      </div>
      <a id="bgg-link" href="https://boardgamegeek.com/collection/user/Alectronic" target="_blank" class="inv-action-btn" style="padding: 8px 18px; font-size: 0.88rem;">BoardGameGeek Profile ↗</a>
    </div>
  </section>

  <!-- WANTED BOARD GAMES -->
  <section class="wishlist-section" id="boardgames-wanted-section"></section>

  <!-- OWNED BOARD GAMES -->
  <section class="wishlist-section" id="boardgames-owned-section"></section>
</main>

<footer id="footer" style="text-align: center; padding: 24px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px;">
  <p>&copy; <span class="year"></span> Alec &middot; gift.alec.today</p>
  <script>document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());</script>
</footer>

<script src="content.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  const data = window.SITE_CONTENT.boardgames;
  if (!data) return;

  document.getElementById('boardgame-subtitle').textContent = 
    `${data.owned.length} Owned Games · ${data.wishlist.length} Wishlist Games`;
  if (data.bggUrl) {
    document.getElementById('bgg-link').href = data.bggUrl;
  }

  function renderCard(item, isWishlist) {
    const card = document.createElement('div');
    card.className = 'wishlist-item';
    card.style.cssText = 'border-radius: 8px; overflow: hidden; position: relative;';

    const idTag = item.bggId
      ? `<span style="font-size:0.7rem; font-weight:800; color:var(--accent); display:block; margin-bottom:2px;">BGG #${item.bggId}</span>`
      : (item.asin ? `<span style="font-size:0.7rem; font-weight:800; color:var(--accent); display:block; margin-bottom:2px;">ASIN: ${item.asin}</span>` : '');

    let infoHTML = '';
    if (isWishlist) {
      infoHTML = `
        ${idTag}
        <a href="${item.url || '#'}" target="_blank" class="wishlist-item-title">${item.name}</a>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px;">
          <span class="wishlist-item-price" style="font-size:0.78rem; font-weight:700;">${item.price}</span>
          ${item.url ? `<a href="${item.url}" target="_blank" class="inv-action-btn" style="padding:3px 8px; font-size:0.72rem;">Gift ↗</a>` : ''}
        </div>`;
    } else {
      infoHTML = `
        ${idTag}
        ${item.url ? `<a href="${item.url}" target="_blank" class="wishlist-item-title">${item.name}</a>` : `<div class="wishlist-item-title">${item.name}</div>`}
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:4px;">
          <span class="inv-item-badge" style="font-size:0.7rem;">${item.badge || item.category}</span>
          <span style="font-size:0.72rem; color:var(--mint); font-weight:600;">✓ Owned</span>
        </div>`;
    }

    card.innerHTML = `
      <div class="wishlist-item-img">
        <img src="${item.img}" alt="${item.name}" loading="lazy">
      </div>
      <div class="wishlist-item-info">${infoHTML}</div>`;
    return card;
  }

  function renderGrid(containerId, title, subtitle, items, isWishlist) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<h2 style="font-size:1.3rem;">${title}</h2><p style="font-size:0.85rem;">${subtitle}</p>`;
    container.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'item-list';
    for (const item of items) {
      grid.appendChild(renderCard(item, isWishlist));
    }
    container.appendChild(grid);
  }

  renderGrid(
    'boardgames-wanted-section',
    `🎁 Board Game Wishlist (${data.wishlist.length})`,
    'Games I would love to add to the table.',
    data.wishlist,
    true
  );

  renderGrid(
    'boardgames-owned-section',
    `✅ Owned Tabletop Games (${data.owned.length})`,
    'Games currently in my home board game collection.',
    data.owned,
    false
  );
})();
</script>
</body>
</html>
