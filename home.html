<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home & Smart Tech 🏡 | Gift Alec Today</title>
  <meta name="description" content="Alec Doran-Twyford's Home & Smart Tech — Room-by-room smart hardware, office setup, bathroom niches, and home improvement projects.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="./style/styles.css">
  <script src="./js/content.js"></script>
  <script src="./js/nav.js"></script>
  <script src="./js/app.js"></script>
</head>
<body>

<div class="banner">Last updated on: 29th July 2026</div>

<header class="site-nav"></header>

<main class="container">
  <section class="hero" style="padding: 16px 0; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 2.2rem;">🏡</span>
      <div>
        <h1>Home & Smart Tech Inventory 🏠</h1>
        <p>Room-by-room breakdown of smart home tech, office workstation, hardware, and ongoing home projects.</p>
      </div>
    </div>
  </section>

  <style>
    .floor-section {
      margin-bottom: 36px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .floor-section:last-of-type {
      border-bottom: none;
    }
    .floor-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .floor-title h2 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--text);
    }
    .floor-icon {
      font-size: 1.8rem;
    }
    .room-layout-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .room-card {
      display: flex;
      flex-direction: row;
      gap: 24px;
      padding: 20px;
      align-items: stretch;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .room-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .room-info-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .room-projects-side {
      flex: 1.2;
      border-left: 1px dashed var(--border);
      padding-left: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .room-smart-tech {
      background: rgba(153, 78, 168, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 12px;
    }
    .smart-tech-header {
      font-size: 0.74rem;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.05em;
    }
    .smart-tech-detail {
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--text-muted);
    }
    .hue-group-badge {
      background: var(--accent-wash);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 800;
    }
    @media (max-width: 768px) {
      .room-card {
        flex-direction: column;
        gap: 16px;
      }
      .room-projects-side {
        border-left: none;
        border-top: 1px dashed var(--border);
        padding-left: 0;
        padding-top: 16px;
      }
    }
  </style>

  <div id="home-content-container" style="margin-top: 24px;"></div>

  
</main>

<footer id="footer" style="text-align: center; padding: 24px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px;">
  <p>&copy; <span class="year"></span> Alec &middot; gift.alec.today</p>
  <script>document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());</script>
</footer>

<script src="./js/content.js"></script>
<script src="./js/nav.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
