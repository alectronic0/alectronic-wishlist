<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home & Smart Tech 🏡 | Gift Alec Today</title>
  <meta name="description" content="Alec Doran-Twyford's Home & Smart Tech — Room-by-room smart hardware, office setup, bathroom niches, and home improvement projects.">
  <meta name="theme-color" content="#160d14">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js"></script>
</head>
<body>

<div class="banner">Last updated on: 29th July 2026</div>

<header class="site-nav"></header>

<main class="container">
  <section class="hero" style="padding: 16px 0; border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 2.2rem;">🏡</span>
      <div>
        <h1>Home & Smart Tech Inventory 🏠</h1>
        <p>Room-by-room breakdown of smart home tech, office workstation, hardware, and ongoing home projects.</p>
      </div>
    </div>
  </section>

  <style>
    .floor-section {
      margin-bottom: 32px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .floor-section:last-of-type {
      border-bottom: none;
    }
    .floor-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .floor-title h2 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--text);
    }
    .floor-icon {
      font-size: 1.8rem;
    }
    .room-layout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .room-smart-tech {
      background: rgba(153, 78, 168, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
    }
    .smart-tech-header {
      font-size: 0.74rem;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.05em;
    }
    .smart-tech-detail {
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--text-muted);
    }
    .hue-group-badge {
      background: var(--accent-wash);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 800;
    }
  </style>

  <div id="home-content-container" style="margin-top: 24px;"></div>

  <script>
  (function() {
    const homeData = window.SITE_CONTENT && window.SITE_CONTENT.home;
    if (!homeData) return;

    const container = document.getElementById('home-content-container');
    if (!container) return;

    function formatLights(lights) {
      if (!lights || Object.keys(lights).length === 0) return '';
      return Object.entries(lights)
        .map(([type, count]) => `${count} ${type}${count > 1 ? 's' : ''}`)
        .join(', ');
    }

    let html = '';
    
    if (homeData.floors) {
      Object.entries(homeData.floors).forEach(([key, floor]) => {
        let roomsHTML = '';
        
        if (floor.rooms) {
          Object.entries(floor.rooms).forEach(([roomKey, room]) => {
            // Render Projects List
            let projectsHTML = '';
            if (room.projects && room.projects.length > 0) {
              projectsHTML = `
                <div style="margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px;">
                  <strong style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.04em;">Active & Planned Projects:</strong>
                  <ul class="project-list" style="margin-top: 8px;">
                    ${room.projects.map(proj => {
                      let badgeClass = 'badge-planned';
                      let statusLabel = 'Planned';
                      if (proj.status === 'in-progress') {
                        badgeClass = 'badge-in-progress';
                        statusLabel = 'In Progress';
                      } else if (proj.status === 'completed') {
                        badgeClass = 'badge-done';
                        statusLabel = 'Completed';
                      }
                      return `
                        <li class="project-item">
                          <span>${proj.name}</span>
                          <span class="project-badge ${badgeClass}">${statusLabel}</span>
                        </li>
                      `;
                    }).join('')}
                  </ul>
                </div>
              `;
            }

            // Render Smart Tech Details
            let smartTechHTML = '';
            const hasLights = room.lights && Object.keys(room.lights).length > 0;
            const hasSwitches = room.switches && room.switches.length > 0;
            const hasHueGroup = room.hueGroup !== undefined;

            if (hasLights || hasSwitches || hasHueGroup) {
              smartTechHTML = `
                <div class="room-smart-tech">
                  <div class="smart-tech-header">
                    <span>💡 Smart Lighting</span>
                    ${hasHueGroup ? `<span class="hue-group-badge">Hue Group ${room.hueGroup}</span>` : ''}
                  </div>
                  <div class="smart-tech-detail">
                    ${hasLights ? `<div><strong>Lights:</strong> ${formatLights(room.lights)}</div>` : ''}
                    ${hasSwitches ? `<div><strong>Switches:</strong> ${room.switches.join(', ')}</div>` : ''}
                  </div>
                </div>
              `;
            }

            roomsHTML += `
              <div class="room-card">
                <div class="room-header" style="margin-bottom: 6px;">
                  <div class="room-title-group">
                    <h3 style="font-size: 1.05rem; margin: 0; color: var(--text); font-weight: 700;">${room.name}</h3>
                  </div>
                </div>
                ${smartTechHTML}
                ${projectsHTML}
              </div>
            `;
          });
        }

        html += `
          <section class="floor-section">
            <div class="floor-title">
              <span class="floor-icon">${floor.icon}</span>
              <h2>${floor.name}</h2>
            </div>
            <div class="room-layout-grid">
              ${roomsHTML}
            </div>
          </section>
        `;
      });
    }

    container.innerHTML = html;
  })();
  </script>
</main>

<footer id="footer" style="text-align: center; padding: 24px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px;">
  <p>&copy; <span class="year"></span> Alec &middot; gift.alec.today</p>
  <script>document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());</script>
</footer>

<script src="nav.js"></script>
</body>
</html>
